version: '3.8'

services:
  influxdb:
    image: influxdb:2.7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-pimonitor}_influxdb
    restart: unless-stopped
    hostname: influxdb
    user: "1000:1000"
    logging:
      driver: loki
      options:
        loki-url: "http://loki:${LOKI_PORT:-3100}/loki/api/v1/push"
    env_file:
      - .env
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - ./configs/influxdb:/etc/influxdb2:ro
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    networks:
      - skynet
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${INFLUXDB_MEMORY_LIMIT:-1g}
          cpus: '0.5'
        reservations:
          memory: 256m
          cpus: '0.25'

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ${COMPOSE_PROJECT_NAME:-pimonitor}_prometheus
    restart: unless-stopped
    hostname: prometheus
    user: "nobody"
    logging:
      driver: loki
      options:
        loki-url: "http://loki:${LOKI_PORT:-3100}/loki/api/v1/push"
    depends_on:
      telegraf:
        condition: service_healthy
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./configs/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - skynet
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEMORY_LIMIT:-512m}
          cpus: '0.5'
        reservations:
          memory: 256m
          cpus: '0.25'

  loki:
    image: grafana/loki:2.9.0
    container_name: ${COMPOSE_PROJECT_NAME:-pimonitor}_loki
    restart: unless-stopped
    hostname: loki
    user: "10001"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./configs/loki:/etc/loki:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - skynet
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${LOKI_MEMORY_LIMIT:-512m}
          cpus: '0.5'
        reservations:
          memory: 256m
          cpus: '0.25'

  alloy:
    image: grafana/alloy:v0.38.0
    container_name: ${COMPOSE_PROJECT_NAME:-pimonitor}_alloy
    restart: unless-stopped
    hostname: alloy
    user: "472"
    depends_on:
      loki:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./configs/alloy:/etc/alloy:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    networks:
      - skynet
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:12345/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
        reservations:
          memory: 128m
          cpus: '0.1'

  telegraf:
    image: telegraf:1.28-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-pimonitor}_telegraf
    restart: unless-stopped
    hostname: telegraf
    user: "telegraf"
    logging:
      driver: loki
      options:
        loki-url: "http://loki:${LOKI_PORT:-3100}/loki/api/v1/push"
    depends_on:
      influxdb:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - /:/hostfs:ro
      - ./configs/telegraf:/etc/telegraf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - skynet
    healthcheck:
      test: ["CMD", "telegraf", "--test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
        reservations:
          memory: 128m
          cpus: '0.1'

  grafana:
    image: grafana/grafana-oss:10.2.0
    container_name: ${COMPOSE_PROJECT_NAME:-pimonitor}_grafana
    restart: unless-stopped
    hostname: grafana
    user: "472"
    logging:
      driver: loki
      options:
        loki-url: "http://loki:${LOKI_PORT:-3100}/loki/api/v1/push"
    depends_on:
      influxdb:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_INSTALL_PLUGINS=${GRAFANA_INSTALL_PLUGINS:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana:/etc/grafana:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - skynet
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-512m}
          cpus: '0.5'
        reservations:
          memory: 256m
          cpus: '0.25'

volumes:
  influxdb-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  alloy-data:
    driver: local

networks:
  skynet:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-pimonitor}_monitoring