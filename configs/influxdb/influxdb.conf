# InfluxDB Configuration
# Optimized for PiMonitor with performance and reliability best practices

# Global settings
reporting-disabled = true
bind-address = "0.0.0.0:8088"

# Meta store configuration
[meta]
  dir = "/var/lib/influxdb2/meta"
  retention-autocreate = true
  logging-enabled = true

# Data store configuration
[data]
  dir = "/var/lib/influxdb2/data"
  wal-dir = "/var/lib/influxdb2/wal"
  wal-fsync-delay = "0s"
  index-version = "inmem"
  trace-logging-enabled = false
  query-log-enabled = true
  validate-keys = false
  cache-max-memory-size = "1g"
  cache-snapshot-memory-size = "25m"
  cache-snapshot-write-cold-duration = "10m"
  compact-full-write-cold-duration = "4h"
  compact-throughput = "48m"
  compact-throughput-burst = "48m"
  max-series-per-database = 1000000
  max-values-per-tag = 100000
  max-concurrent-compactions = 0
  max-index-log-file-size = "1m"
  series-id-set-cache-size = 100

# Coordinator configuration
[coordinator]
  write-timeout = "10s"
  max-concurrent-queries = 0
  query-timeout = "0s"
  log-queries-after = "0s"
  max-select-point = 0
  max-select-series = 0
  max-select-buckets = 0

# Retention policy configuration
[retention]
  enabled = true
  check-interval = "30m0s"

# Shard precreation configuration
[shard-precreation]
  enabled = true
  check-interval = "10m0s"
  advance-period = "30m0s"

# Monitor configuration
[monitor]
  store-enabled = true
  store-database = "_internal"
  store-interval = "10s"

# Subscriber configuration
[subscriber]
  enabled = true
  http-timeout = "30s"
  insecure-skip-verify = false
  ca-certs = ""
  write-concurrency = 40
  write-buffer-size = 1000

# HTTP configuration
[http]
  enabled = true
  bind-address = ":8086"
  auth-enabled = false
  log-enabled = true
  suppress-write-log = false
  write-tracing = false
  pprof-enabled = true
  debug-pprof-enabled = false
  https-enabled = false
  https-certificate = "/etc/ssl/influxdb.pem"
  https-private-key = ""
  max-row-limit = 0
  max-connection-limit = 0
  shared-secret = ""
  realm = "InfluxDB"
  unix-socket-enabled = false
  bind-socket = "/var/run/influxdb.sock"
  max-body-size = 25000000
  access-log-path = ""
  max-concurrent-write-limit = 0
  max-enqueued-write-limit = 0
  enqueued-write-timeout = 30000000000

# Input plugins configuration
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.kernel]]

[[inputs.mem]]

[[inputs.processes]]

[[inputs.swap]]

[[inputs.system]]

[[inputs.net]]

[[inputs.netstat]]

# Logging configuration
[logging]
  format = "auto"
  level = "info"
  suppress-logo = false

# Continuous queries configuration
[continuous_queries]
  log-enabled = true
  enabled = true
  query-stats-enabled = false
  run-interval = "1s"