# Loki Configuration - Optimized for PiMonitor
# Following Grafana's official best practices for single-node deployment

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  log_format: logfmt
  graceful_shutdown_timeout: 5s
  http_server_read_timeout: 30s
  http_server_write_timeout: 30s

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# Memberlist configuration for single-node setup
memberlist:
  abort_if_cluster_join_fails: false
  bind_port: 7946
  join_members: []

# Query optimization
query_range:
  align_queries_with_step: true
  max_retries: 5
  parallelise_shardable_queries: true
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 256
        ttl: 1h

# Frontend configuration for query performance
frontend:
  max_outstanding_per_tenant: 2048
  compress_responses: true
  log_queries_longer_than: 5s

# Query scheduler for better resource management
query_scheduler:
  max_outstanding_requests_per_tenant: 32768

# Schema configuration with latest recommendations
schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h
    # New schema for better performance (v12)
    - from: 2023-01-01
      store: tsdb
      object_store: filesystem
      schema: v12
      index:
        prefix: index_
        period: 24h

# Storage configuration optimized for single-node
storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    cache_ttl: 24h
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
    cache_ttl: 24h
    shared_store: filesystem

# Ruler configuration for alerting
ruler:
  alertmanager_url: http://prometheus:9093
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules
  ring:
    kvstore:
      store: inmemory
  enable_api: true
  enable_alertmanager_v2: true
  external_url: http://localhost:3100

# Analytics configuration
analytics:
  reporting_enabled: false

# Limits configuration optimized for Raspberry Pi
limits_config:
  # Retention and cleanup
  retention_period: 30d
  
  # Ingestion limits
  ingestion_rate_strategy: local
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  max_line_size: 256000
  max_line_size_truncate: false
  
  # Stream limits
  max_streams_per_user: 10000
  max_global_streams_per_user: 5000
  
  # Query limits
  max_query_length: 721h
  max_query_parallelism: 32
  max_query_series: 500
  max_samples_per_query: 1000000
  
  # Chunk limits
  max_chunks_per_query: 2000000
  max_concurrent_tail_requests: 10
  
  # Label limits
  max_label_name_length: 1024
  max_label_value_length: 4096
  max_label_names_per_series: 30
  
  # Time-based limits
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  creation_grace_period: 10m
  
  # Performance tuning
  enforce_metric_name: false
  allow_structured_metadata: true
  
  # Rate limiting
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB

# Chunk store configuration
chunk_store_config:
  max_look_back_period: 0s
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 512
      ttl: 1h

# Table manager for retention (deprecated but still used for v11 schema)
table_manager:
  retention_deletes_enabled: true
  retention_period: 30d

# Compactor configuration for log cleanup
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_cancel_period: 24h

# Ingester configuration for write performance
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 5m
  chunk_retain_period: 30s
  max_transfer_retries: 0
  wal:
    enabled: true
    dir: /loki/wal
    checkpoint_duration: 5m
    flush_on_shutdown: true

# Distributor configuration for load balancing
distributor:
  ring:
    kvstore:
      store: inmemory