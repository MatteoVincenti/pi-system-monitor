apiVersion: 1

deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    basicAuth: false
    isDefault: false
    version: 1
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "trace_id=(\\w+)"
          name: "TraceID"
          url: "$${__value.raw}"
        - datasourceUid: prometheus  
          matcherRegex: "request_id=(\\w+)"
          name: "RequestID"
          url: "$${__value.raw}"
      alertmanager:
        handleGrafanaManagedAlerts: true
        implementation: prometheus
        url: http://prometheus:9093