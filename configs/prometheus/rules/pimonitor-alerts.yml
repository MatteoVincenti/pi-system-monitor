# PiMonitor Alerting Rules
# Comprehensive alerting for system health and performance monitoring

groups:
  - name: pimonitor.system
    interval: 30s
    rules:
      # High CPU usage alert
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for more than 5 minutes on {{ $labels.instance }}"

      # High memory usage alert
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 85% for more than 5 minutes on {{ $labels.instance }}"

      # High disk usage alert
      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "High disk usage detected"
          description: "Disk usage is above 90% on {{ $labels.device }} ({{ $labels.instance }})"

      # System load alert
      - alert: HighSystemLoad
        expr: node_load15 > 2
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High system load detected"
          description: "15-minute load average is {{ $value }} on {{ $labels.instance }}"

  - name: pimonitor.services
    interval: 30s
    rules:
      # Service down alerts
      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 1m
        labels:
          severity: critical
          service: grafana
        annotations:
          summary: "Grafana service is down"
          description: "Grafana has been down for more than 1 minute"

      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
          service: prometheus
        annotations:
          summary: "Prometheus service is down"
          description: "Prometheus has been down for more than 1 minute"

      - alert: InfluxDBDown
        expr: up{job="influxdb"} == 0
        for: 1m
        labels:
          severity: critical
          service: influxdb
        annotations:
          summary: "InfluxDB service is down"
          description: "InfluxDB has been down for more than 1 minute"

      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 1m
        labels:
          severity: critical
          service: loki
        annotations:
          summary: "Loki service is down"
          description: "Loki has been down for more than 1 minute"

      - alert: AlloyDown
        expr: up{job="alloy"} == 0
        for: 1m
        labels:
          severity: warning
          service: alloy
        annotations:
          summary: "Alloy service is down"
          description: "Alloy has been down for more than 1 minute"

      - alert: TelegrafDown
        expr: up{job="telegraf"} == 0
        for: 2m
        labels:
          severity: warning
          service: telegraf
        annotations:
          summary: "Telegraf service is down"
          description: "Telegraf has been down for more than 2 minutes"

  - name: pimonitor.performance
    interval: 30s
    rules:
      # High response time alerts
      - alert: HighGrafanaResponseTime
        expr: histogram_quantile(0.95, rate(grafana_http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          service: grafana
        annotations:
          summary: "High Grafana response time"
          description: "95th percentile response time is {{ $value }}s for Grafana"

      # High error rate alerts
      - alert: HighGrafanaErrorRate
        expr: rate(grafana_http_request_total{status_code=~"5.."}[5m]) / rate(grafana_http_request_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          service: grafana
        annotations:
          summary: "High Grafana error rate"
          description: "Error rate is {{ $value | humanizePercentage }} for Grafana"

  - name: pimonitor.storage
    interval: 60s
    rules:
      # Prometheus storage alerts
      - alert: PrometheusStorageNearFull
        expr: prometheus_tsdb_retention_limit_bytes / prometheus_tsdb_size_bytes < 0.1
        for: 5m
        labels:
          severity: warning
          service: prometheus
        annotations:
          summary: "Prometheus storage nearly full"
          description: "Prometheus storage is {{ $value | humanizePercentage }} full"

      # InfluxDB storage alerts
      - alert: InfluxDBStorageNearFull
        expr: influxdb_database_diskBytes / influxdb_database_diskBytes_limit > 0.9
        for: 5m
        labels:
          severity: warning
          service: influxdb
        annotations:
          summary: "InfluxDB storage nearly full"
          description: "InfluxDB storage is {{ $value | humanizePercentage }} full"

  - name: pimonitor.docker
    interval: 30s
    rules:
      # Container restart alerts
      - alert: ContainerRestarted
        expr: increase(container_start_time_seconds[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: docker
        annotations:
          summary: "Container restarted"
          description: "Container {{ $labels.name }} has restarted"

      # High container memory usage
      - alert: HighContainerMemoryUsage
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: docker
        annotations:
          summary: "High container memory usage"
          description: "Container {{ $labels.name }} memory usage is {{ $value }}%"

      # High container CPU usage
      - alert: HighContainerCPUUsage
        expr: rate(container_cpu_usage_seconds_total[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: docker
        annotations:
          summary: "High container CPU usage"
          description: "Container {{ $labels.name }} CPU usage is {{ $value }}%"