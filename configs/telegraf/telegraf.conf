# Telegraf Configuration
# Optimized for PiMonitor with comprehensive system monitoring

# Global tags applied to all metrics
[global_tags]
  environment = "${ENVIRONMENT:-production}"
  cluster = "pimonitor"
  datacenter = "local"
  host = "${HOSTNAME}"

# Agent configuration
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false
  debug = false
  quiet = false
  logfile = ""
  logfile_rotation_interval = "0d"
  logfile_rotation_max_size = "0MB"
  logfile_rotation_max_archives = 5

# =============================================================================
# OUTPUT PLUGINS
# =============================================================================

# InfluxDB v2 output
[[outputs.influxdb_v2]]
  urls = ["http://$INFLUXDB_HOST:$INFLUXDB_PORT"]
  token = "$DOCKER_INFLUXDB_INIT_ADMIN_TOKEN"
  organization = "$DOCKER_INFLUXDB_INIT_ORG"
  bucket = "$DOCKER_INFLUXDB_INIT_BUCKET"
  timeout = "5s"
  user_agent = "telegraf"
  content_encoding = "gzip"
  insecure_skip_verify = false

# Prometheus output for metrics scraping
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  collectors_exclude = ["gocollector", "process"]
  string_as_label = true
  export_timestamp = false

# =============================================================================
# INPUT PLUGINS - SYSTEM MONITORING
# =============================================================================

# CPU metrics
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = true
  core_tags = false
  fieldpass = ["usage_active", "usage_idle", "usage_system", "usage_user", "usage_iowait", "usage_irq", "usage_nice", "usage_softirq", "usage_steal"]

# Memory metrics
[[inputs.mem]]
  fieldpass = ["total", "available", "used", "free", "cached", "buffered", "used_percent", "available_percent"]

# Disk usage metrics
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]
  fieldpass = ["total", "free", "used", "used_percent", "inodes_total", "inodes_free", "inodes_used"]

# Disk I/O metrics
[[inputs.diskio]]
  devices = ["sda", "sdb", "nvme0n1", "mmcblk0"]
  skip_serial_number = false
  fieldpass = ["reads", "writes", "read_bytes", "write_bytes", "read_time", "write_time", "io_time"]

# Network interface metrics
[[inputs.net]]
  interfaces = ["eth*", "wlan*", "en*", "wl*"]
  ignore_protocol_stats = false
  fieldpass = ["bytes_sent", "bytes_recv", "packets_sent", "packets_recv", "err_in", "err_out", "drop_in", "drop_out"]

# Network statistics
[[inputs.netstat]]
  fieldpass = ["tcp_established", "tcp_syn_sent", "tcp_syn_recv", "tcp_fin_wait1", "tcp_fin_wait2", "tcp_time_wait", "tcp_close", "tcp_close_wait", "tcp_last_ack", "tcp_listen", "tcp_closing", "udp_socket"]

# System load and uptime
[[inputs.system]]
  fieldpass = ["load1", "load5", "load15", "uptime", "uptime_format", "n_users", "n_cpus"]

# Process monitoring
[[inputs.processes]]
  fieldpass = ["running", "sleeping", "stopped", "total", "total_threads", "zombies"]

# Kernel metrics
[[inputs.kernel]]
  fieldpass = ["boot_time", "context_switches", "entropy_avail", "interrupts", "processes_forked"]

# Temperature sensors
[[inputs.temp]]
  add_device_tag = true

# Swap usage
[[inputs.swap]]
  fieldpass = ["total", "used", "free", "used_percent"]

# =============================================================================
# INPUT PLUGINS - DOCKER MONITORING
# =============================================================================

# Docker container metrics
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_names = []
  source_tag = false
  container_name_include = []
  container_name_exclude = []
  timeout = "5s"
  docker_label_include = []
  docker_label_exclude = []
  tag_env = ["JAVA_HOME", "HEAP_SIZE"]
  perdevice = true
  total = false
  total_include = ["cpu", "blkio", "network"]

# Docker log metrics
[[inputs.docker_log]]
  endpoint = "unix:///var/run/docker.sock"
  from_beginning = false
  timeout = "5s"
  container_name_include = []
  container_name_exclude = []
  container_state_include = []
  container_state_exclude = []

# =============================================================================
# INPUT PLUGINS - APPLICATION MONITORING
# =============================================================================

# HTTP response monitoring for services
[[inputs.http_response]]
  urls = [
    "http://grafana:3000/api/health",
    "http://prometheus:9090/-/healthy",
    "http://influxdb:8086/health",
    "http://loki:3100/ready"
  ]
  response_timeout = "5s"
  method = "GET"
  follow_redirects = false
  insecure_skip_verify = false

# Prometheus metrics scraping
[[inputs.prometheus]]
  urls = [
    "http://prometheus:9090/metrics",
    "http://grafana:3000/metrics",
    "http://loki:3100/metrics",
    "http://alloy:12345/metrics"
  ]
  response_timeout = "5s"
  metric_version = 2
  insecure_skip_verify = false

# =============================================================================
# INPUT PLUGINS - LOG MONITORING
# =============================================================================

# System log monitoring
[[inputs.tail]]
  files = ["/var/log/syslog", "/var/log/auth.log", "/var/log/kern.log"]
  from_beginning = false
  pipe = false
  watch_method = "inotify"
  max_undelivered_lines = 1000
  character_encoding = "utf-8"
  data_format = "grok"
  grok_patterns = [
    "%{SYSLOGTIMESTAMP:timestamp} %{IPORHOST:host} %{DATA:program}(?:\\[%{POSINT:pid}\\])?: %{GREEDYDATA:message}"
  ]
  grok_timezone = "Local"

# =============================================================================
# INPUT PLUGINS - PERFORMANCE MONITORING
# =============================================================================

# Interrupts monitoring
[[inputs.interrupts]]
  cpu_as_tag = true

# Linux sysctl monitoring
[[inputs.linux_sysctl_fs]]

# Conntrack monitoring
[[inputs.conntrack]]
  files = ["ip_conntrack_count", "ip_conntrack_max", "nf_conntrack_count", "nf_conntrack_max"]
  dirs = ["/proc/sys/net/ipv4/netfilter", "/proc/sys/net/netfilter"]

# =============================================================================
# INPUT PLUGINS - SECURITY MONITORING
# =============================================================================

# File monitoring for security
[[inputs.filestat]]
  files = ["/etc/passwd", "/etc/shadow", "/etc/group", "/etc/hosts"]
  md5 = true

# =============================================================================
# PROCESSOR PLUGINS
# =============================================================================

# Add hostname tag
[[processors.enum]]
  [[processors.enum.mapping]]
    tag = "host"
    dest = "hostname"
    [processors.enum.mapping.value_mappings]
      "*" = "${HOSTNAME}"

# Convert string fields to tags for better querying
[[processors.strings]]
  [[processors.strings.trim]]
    field = "message"
    cutset = " \t\n\r"

# =============================================================================
# AGGREGATOR PLUGINS
# =============================================================================

# Basic statistics aggregation
[[aggregators.basicstats]]
  period = "30s"
  drop_original = false
  stats = ["count", "min", "max", "mean", "stdev", "s2", "sum"]

# Histogram aggregation for response times
[[aggregators.histogram]]
  period = "30s"
  drop_original = false
  buckets = [0.1, 0.5, 1.0, 2.5, 5.0, 10.0]
